[project]
name = "performancelab"
version = "0.1.0"
description = "REST API for room, user and reservation management — study project for performance and load testing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.30.0",
    "email-validator>=2.0.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "freezegun>=1.5.0",
    "httpx2>=2.9.1",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
check_untyped_defs = true
ignore_missing_imports = true
